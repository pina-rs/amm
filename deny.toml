[graph]
all-features = true

[advisories]
db-path = "target/advisory-db"
db-urls = ["https://github.com/RustSec/advisory-db.git"]
ignore = [
	# solana-rpc-client depends on bincode 1.3.3, which is flagged as
	# unmaintained. Only the CLI links it; remove once solana-client upgrades.
	{ id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 is a transitive dependency of solana-rpc-client" },
	# The pinned solana-rpc-client stack depends on zstd 0.13, and no patched
	# 0.13.x exists: the fixes land in zstd 0.14.3 and zstd-safe 8.2.0, which
	# the Solana crates do not accept yet. None of this reaches the on-chain
	# program; drop these when the Solana client crates move to the patched
	# majors.
	{ id = "RUSTSEC-2026-0391", reason = "zstd 0.13 stream-context leak; host-side transitive of the pinned solana-rpc-client stack" },
	{ id = "RUSTSEC-2026-0398", reason = "zstd-safe 7.x seekable decompress; host-side transitive of the pinned solana-rpc-client stack" },
	{ id = "RUSTSEC-2026-0403", reason = "zstd-safe 7.x legacy-frame leak; host-side transitive of the pinned solana-rpc-client stack" },
	{ id = "RUSTSEC-2026-0410", reason = "zstd-sys wasm32 allocator shim; this workspace builds no wasm targets" },
]

[bans]
# The CLI links the Solana host stack, which pulls two trains of several crates
# (solana-pubkey 3 and 4, syn 2 and 3, sha2 0.10 and 0.11, ...). The on-chain
# program's graph is tiny and pinned through `pina`; duplicates elsewhere are
# expected and not actionable here.
multiple-versions = "allow"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# Permissive licenses used by the host-side dependency graph (CLI and
# clients). The on-chain program links none of these.
[licenses]
version = 2
allow = [
	"0BSD",
	"Apache-2.0",
	"Apache-2.0 WITH LLVM-exception",
	"BSD-2-Clause",
	"BSD-3-Clause",
	"BSL-1.0",
	"CDLA-Permissive-2.0",
	"ISC",
	"MIT",
	"Unicode-3.0",
	"Unlicense",
	"Zlib",
]
