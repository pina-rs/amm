[graph]
all-features = true

[advisories]
db-path = "target/advisory-db"
db-urls = ["https://github.com/RustSec/advisory-db.git"]
ignore = [
	# solana-rpc-client depends on bincode 1.3.3, which is flagged as
	# unmaintained. Only the CLI links it; remove once solana-client upgrades.
	{ id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 is a transitive dependency of solana-rpc-client" },
]

[bans]
# The CLI links the Solana host stack, which pulls two trains of several crates
# (solana-pubkey 3 and 4, syn 2 and 3, sha2 0.10 and 0.11, ...). The on-chain
# program's graph is tiny and pinned through `pina`; duplicates elsewhere are
# expected and not actionable here.
multiple-versions = "allow"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# Permissive licenses used by the host-side dependency graph (CLI and
# clients). The on-chain program links none of these.
[licenses]
version = 2
allow = [
	"0BSD",
	"Apache-2.0",
	"Apache-2.0 WITH LLVM-exception",
	"BSD-2-Clause",
	"BSD-3-Clause",
	"BSL-1.0",
	"CDLA-Permissive-2.0",
	"ISC",
	"MIT",
	"Unicode-3.0",
	"Unlicense",
	"Zlib",
]
