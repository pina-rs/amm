[package]
name = "pina_amm_surfpool_tests"
version = "0.0.0"
edition = "2024"
publish = false
description = "End-to-end tests that run the compiled Pina AMM on an offline Surfnet"

# Surfpool's host runtime pulls a large Solana validator dependency graph.
# Keeping it in its own workspace stops it from leaking into the program's SBF
# build or the published client crates.
[workspace]

[dependencies]
base64 = "=0.22.1"
pina_amm_client = { path = "../../../../clients/rust/pina_amm" }
pina_test = "=0.24.0"
serde_json = "1"
solana-commitment-config = "=3.1.1"
solana-message = "=4.6.0"
solana-program-pack = "=3.1.0"
solana-rpc-client-api = "=4.3.2"
# pina_test 0.24 requires the 4.3 line and surfpool 1.7 needs >=4.3.2; pin
# the shared runtime so the resolver does not hold 4.3.0.
solana-runtime = "=4.3.2"
solana-transaction = "=4.3.0"
spl-token-2022-interface = "=3.1.1"
surfpool-sdk = "=1.7.0"

[lints.rust]
missing_docs = "allow"
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
