[package]
name = "pina_amm_cpi"
version = "0.1.0"
categories = ["cryptography::cryptocurrencies", "no-std"]
edition.workspace = true
homepage.workspace = true
keywords = ["solana", "amm", "pina", "cpi", "defi"]
license.workspace = true
repository = "https://github.com/pina-rs/amm/tree/main/clients/cpi/pina_amm"
rust-version.workspace = true
description = "no_std CPI client for calling the Pina AMM from other on-chain Solana programs"

[dependencies]
pina = { workspace = true }

# Generated by `pina generate`. The source is reviewed through the IDL, not
# linted against the workspace's hand-written-code policy; only the lints the
# renderer's output is known to trip are relaxed here.
[lints.clippy]
unnecessary_cast = "allow"
