name: pina_amm
description: >-
  Dart and Flutter client for the Pina AMM on Solana: instruction builders,
  account decoders, PDAs, events, and errors generated from the program IDL.
version: 0.0.0
homepage: https://github.com/pina-rs/amm
repository: https://github.com/pina-rs/amm/tree/main/clients/dart
issue_tracker: https://github.com/pina-rs/amm/issues
topics:
  - solana
  - amm
  - defi
  - blockchain

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  meta: ^1.16.0
  solana_kit_accounts: ">=0.10.0 <1.0.0"
  solana_kit_addresses: ">=0.10.0 <1.0.0"
  solana_kit_codecs_core: ">=0.10.0 <1.0.0"
  solana_kit_codecs_data_structures: ">=0.10.0 <1.0.0"
  solana_kit_codecs_numbers: ">=0.10.0 <1.0.0"
  solana_kit_codecs_strings: ">=0.10.0 <1.0.0"
  solana_kit_errors: ">=0.10.0 <1.0.0"
  solana_kit_instructions: ">=0.10.0 <1.0.0"
  solana_kit_rpc_types: ">=0.10.0 <1.0.0"

dev_dependencies:
  test: ^1.29.0
